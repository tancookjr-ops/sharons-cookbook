name: Deploy to Staging

# Installed by repo-onboard (adapted from BorealCodex's deploy-staging.yml).
# Every push to `[[branches.staging]]` (the default branch, where all updates start) goes to
# staging, plus a manual "Run workflow" button. Staging is the owner's check gate:
# view it on the target device before promoting.
#   - FTP staging folder, when the FTP secrets exist (ftp.yml)
#   - GitHub Pages /staging/, always (pages.yml) — sandboxed, never touches real data
on:
  push:
    branches: [[[branches.staging]]]
    paths-ignore:
      - '**.md'
      - 'work/**'
      - '_shared/**'
      - '_templates/**'
      - '_archive/**'
      - '.claude/**'
  workflow_dispatch:

# Staging has its own lock so it never blocks (or is blocked by) a production deploy.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    # Nothing reaches staging if a project check fails (every scripts/check-*)
    # or a mirrored copy has drifted from the live files (_shared/rules.md §2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Project checks (scripts/check-*)
        run: |
          shopt -s nullglob
          for c in scripts/check-*; do
            echo "▶ $c"
            case "$c" in *.mjs|*.js) node "$c" ;; *.sh) bash "$c" ;; *.py) python3 "$c" ;; esac
          done
      - name: Mirrored copies match the live files
        run: bash scripts/sync-mirrors.sh --check

  ftp:
    needs: check
    uses: ./.github/workflows/ftp.yml
    with:
      target: staging
      ref: ${{ github.sha }}
    secrets: inherit

  pages:
    needs: check
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
