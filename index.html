<style>
  /* Toast region positioning (matches the product); sits above the
     mobile tab bar, drops to the viewport edge once the sidebar docks. */
  .toast-region {
    width: min(92vw, 26rem);
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 90;
    bottom: calc(4.8rem + env(safe-area-inset-bottom));
  }
  @media (min-width: 900px) { .toast-region { bottom: 1rem; } }
  #update-banner {
    position: fixed; z-index: 200; left: 50%; transform: translateX(-50%);
    top: calc(.6rem + env(safe-area-inset-top));
    background: #2c3a2e; color: #faf6ef; border: 0; border-radius: 999px;
    font: 600 15px/1 system-ui, sans-serif; padding: .8em 1.3em; cursor: pointer;
    box-shadow: 0 4px 16px rgb(0 0 0 / .25);
  }
</style>

<script type="text/babel" src="app.jsx"></script>
<script>
/* Service worker: offline cache + central updates. When a new version is
   waiting, show a one-tap "Update ready" banner. */
(function () {
  if (!('serviceWorker' in navigator) || location.protocol.indexOf('http') !== 0) return;
  navigator.serviceWorker.register('./sw.js').then(function (reg) {
    function offerUpdate(worker) {
      if (document.getElementById('update-banner')) return;
      var b = document.createElement('button');
      b.id = 'update-banner';
      b.textContent = 'Update ready — tap to reload';
      b.onclick = function () { worker.postMessage({ type: 'SKIP_WAITING' }); };
      document.body.appendChild(b);
    }
    if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
    /* PWAs launched from the home screen don't reliably re-check for a new
       SW — force a check now and whenever the app returns to the foreground. */
    reg.update().catch(function () {});
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') reg.update().catch(function () {});
    });
    reg.addEventListener('updatefound', function () {
      var nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', function () {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(nw);
      });
    });
  }).catch(function () {});
  var refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!refreshing) { refreshing = true; location.reload(); }
  });
})();
</script>
</body>
