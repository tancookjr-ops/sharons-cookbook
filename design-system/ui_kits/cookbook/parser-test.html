<!-- @dsCard group="Cookbook app" viewport="900x700" name="Import parser test" subtitle="Feeds a sample cookbook text through extractRecipes + analyzeDraft" -->
<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>parser test</title></head>
<body style="font: 14px/1.5 monospace; padding: 20px; white-space: pre-wrap;">
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#8FAE84"/><text x="50" y="62" font-size="34" text-anchor="middle" fill="#1A1A1A" font-family="serif">SC</text></svg></template>
<div id="out">running…</div>
<script src="import-parse.js"></script>
<script>
const SAMPLE = `The Green Kitchen — collected recipes

Maple Walnut Scones

Ingredients:
2 cups all-purpose flour
1/2 cup butter, cold
1 egg
3/4 cup walnuts, chopped
1/4 cup maple syrup
1 tsp baking powder

Method:
Preheat the oven to 200 degrees and line a baking sheet with parchment paper.
Cut the butter into the flour until the mixture resembles coarse crumbs, then stir in walnuts.
Whisk the egg with maple syrup, fold into the dry mix, shape and bake for 18 minutes until golden.

Honey Garlic Tofu

Ingredients:
1 block tofu, pressed
3 tbsp soy sauce
2 tbsp honey
4 cloves garlic, minced
1 tbsp cornstarch

Method:
Cube the tofu and toss with cornstarch until evenly coated on all sides.
Pan-fry until golden, then add the garlic and stir for one minute.
Whisk soy sauce and honey together, pour over, and simmer until glossy.

Summer Ratatouille

Ingredients:
2 zucchini, sliced
1 eggplant, cubed
4 tomatoes, chopped
1 onion, diced
3 tbsp olive oil
2 cloves garlic

Method:
Soften the onion and garlic in olive oil over medium heat until translucent.
Add eggplant and cook five minutes, then the zucchini and tomatoes.
Simmer gently for twenty five minutes and season well before serving.`;

const drafts = window.extractRecipes(SAMPLE);
const crit = { vegan: true, 'soy-free': true, 'wheat-free': false, 'egg-free': false };
const lines = [];
lines.push('DRAFTS FOUND: ' + drafts.length + ' (expect 3)');
for (const d of drafts) {
  const a = window.analyzeDraft(d, crit, true);
  lines.push('');
  lines.push('## ' + d.title + '  [' + a.status.toUpperCase() + ']');
  lines.push('ingredients: ' + a.ingredients.map((i) => (i.amount || '') + ' ' + (i.unit || '') + ' ' + i.name).join(' | '));
  lines.push('steps: ' + d.steps.length);
  if (a.hits.length) lines.push('hits: ' + a.hits.map((h) => h.ing + ' -> ' + (h.sub || 'BLOCKED')).join('; '));
}
document.getElementById('out').textContent = lines.join('\n');
</script>
</body>
</html>
