<!-- @dsCard group="Components" viewport="700x300" name="Buttons & controls" subtitle="Pill buttons, icon buttons, segmented control" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buttons &amp; controls</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg); padding: 22px 24px; }
  .row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-bottom: 1rem; }
  .row:last-child { margin-bottom: 0; }
  .lbl { width: 100%; font-size: .72em; text-transform: uppercase; letter-spacing: .07em; color: var(--text-soft); font-weight: 700; margin-bottom: -.2rem; }
</style>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#8FAE84"/><text x="50" y="62" font-size="34" text-anchor="middle" fill="#1A1A1A" font-family="serif">SC</text></svg></template>
<div id="root"></div>
<script type="text/babel">
  const { Button, IconButton, SegmentedControl } = window.SharonSCookbookDesignSystem_c765c0;

  function Demo() {
    const [view, setView] = React.useState('week');
    return (
      <div>
        <div className="row">
          <span className="lbl">Variants</span>
          <Button variant="primary" icon="＋">New recipe</Button>
          <Button variant="ghost">Plan meals</Button>
          <Button variant="danger">Delete</Button>
          <Button variant="danger-ghost">Remove</Button>
          <Button variant="primary" disabled>Disabled</Button>
        </div>
        <div className="row">
          <span className="lbl">Sizes</span>
          <Button variant="primary" size="sm">Small</Button>
          <Button variant="primary">Medium</Button>
          <Button variant="primary" size="lg">Large</Button>
        </div>
        <div className="row">
          <span className="lbl">Icon buttons</span>
          <IconButton label="Menu">☰</IconButton>
          <IconButton label="Theme">☀</IconButton>
          <IconButton label="Fewer">−</IconButton>
          <IconButton label="More">＋</IconButton>
          <IconButton label="Remove">✕</IconButton>
        </div>
        <div className="row">
          <span className="lbl">Segmented control</span>
          <SegmentedControl
            value={view}
            onChange={setView}
            options={[
              { value: 'day', label: 'Day' },
              { value: 'week', label: 'Week' },
              { value: 'month', label: 'Month' },
            ]}
          />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
