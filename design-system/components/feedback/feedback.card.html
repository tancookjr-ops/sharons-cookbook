<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg); padding: 22px 24px; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1rem; }
  .lbl { width: 100%; font-size: .72em; text-transform: uppercase; letter-spacing: .07em; color: var(--text-soft); font-weight: 700; margin-bottom: -.1rem; }
  .cols { display: grid; grid-template-columns: 1.1fr 1fr; gap: 1.2rem; align-items: start; }
</style>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#8FAE84"/><text x="50" y="62" font-size="34" text-anchor="middle" fill="#1A1A1A" font-family="serif">SC</text></svg></template>
<div id="root"></div>
<script type="text/babel">
  const { Chip, AlertPill, EmptyState, Toast, Button } = window.SharonSCookbookDesignSystem_c765c0;

  function Demo() {
    return (
      <div>
        <div className="row">
          <span className="lbl">Chips</span>
          <Chip>Soups &amp; stews</Chip>
          <Chip>Maritime</Chip>
          <Chip variant="tag">vegan</Chip>
          <Chip variant="tag">garden</Chip>
          <Chip variant="danger">expired</Chip>
          <Chip variant="warn">soon</Chip>
          <Chip variant="info">⏱ 35 min</Chip>
        </div>
        <div className="row">
          <span className="lbl">Alert strip</span>
          <div className="alert-strip">
            <AlertPill tone="danger">2 expired</AlertPill>
            <AlertPill tone="warn">3 expiring soon</AlertPill>
            <AlertPill tone="info">1 low on stock</AlertPill>
          </div>
        </div>
        <div className="cols">
          <div>
            <span className="lbl">Toasts</span>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '.5rem', alignItems: 'flex-start', marginTop: '.5rem' }}>
              <Toast tone="success">Recipe saved</Toast>
              <Toast tone="warn">A recipe needs a title</Toast>
              <Toast tone="error">Could not read that image</Toast>
            </div>
          </div>
          <div>
            <span className="lbl">Empty state</span>
            <EmptyState action={<Button icon="＋">Add your first recipe</Button>}>
              Your cookbook is empty.
            </EmptyState>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
