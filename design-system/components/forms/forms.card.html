<!-- @dsCard group="Components" viewport="700x340" name="Form fields" subtitle="Inputs, selects, textareas, checkboxes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form fields</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg); padding: 22px 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 1.4rem; max-width: 640px; }
</style>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#8FAE84"/><text x="50" y="62" font-size="34" text-anchor="middle" fill="#1A1A1A" font-family="serif">SC</text></svg></template>
<div id="root"></div>
<script type="text/babel">
  const { Field, Input, Textarea, Select, Checkbox } = window.SharonSCookbookDesignSystem_c765c0;

  function Demo() {
    return (
      <div className="grid">
        <Field label="Title"><Input defaultValue="Roasted Squash & Sage Soup" /></Field>
        <Field label="Cuisine"><Select options={['Canadian', 'Mediterranean', 'Greek', 'Maritime']} defaultValue="Canadian" /></Field>
        <Field label="Search"><Input type="search" placeholder="Search recipes, ingredients, tags…" /></Field>
        <Field label="Servings"><Input type="number" defaultValue="6" /></Field>
        <div style={{ gridColumn: '1 / -1' }}>
          <Field label="Description" hint="A short tagline shown under the title">
            <Textarea rows={2} defaultValue="Deeply roasted squash blended silky-smooth with fresh sage." />
          </Field>
        </div>
        <Checkbox label="Favourite" defaultChecked />
        <Checkbox label="Freezer friendly" />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
