<!-- @dsCard group="Type" viewport="700x210" name="Numerals, caps & mono" subtitle="Tabular figures, uppercase eyebrows, the mono stack" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); padding: 20px 24px; color: var(--text); font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 26px; }
  .tag { font-size: .68rem; color: var(--text-soft); text-transform: uppercase; letter-spacing: .06em; }
  .nums { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.15rem; margin-top: 4px; }
  .eyebrow { text-transform: uppercase; letter-spacing: .06em; font-size: .72rem; font-weight: 700; color: var(--accent); margin-top: 6px; }
  .mono { font-family: var(--font-mono); font-size: .82rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-top: 6px; color: var(--text); }
</style>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#8FAE84"/><text x="50" y="62" font-size="34" text-anchor="middle" fill="#1A1A1A" font-family="serif">SC</text></svg></template>
  <div class="grid">
    <div>
      <span class="tag">Tabular numerals</span>
      <div class="nums">310 kcal · 14 g · $12.40</div>
      <div class="nums">08 / 15 · 45 min · 1,200 g</div>
      <p style="font-size:.78rem;color:var(--text-soft);margin:.4em 0 0">Nutrition, times, quantities and tables align on tabular figures.</p>
    </div>
    <div>
      <span class="tag">Uppercase eyebrow · accent</span>
      <div class="eyebrow">Breakfast · Prep time · Freezer</div>
      <span class="tag" style="display:block;margin-top:14px">Monospace (AI import)</span>
      <div class="mono">"op": "CREATE_RECIPE"</div>
    </div>
  </div>
</body>
</html>
