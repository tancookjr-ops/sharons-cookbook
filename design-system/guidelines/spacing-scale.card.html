<!-- @dsCard group="Spacing" viewport="700x210" name="Spacing scale" subtitle="The rem rhythm: 0.3 · 0.5 · 0.8 · 1 · 1.2 · 1.6 · 2" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); padding: 20px 24px; color: var(--text); font-family: var(--font-body); }
  .row { display: flex; align-items: center; gap: 14px; padding: 4px 0; }
  .tok { width: 118px; font-size: .74rem; color: var(--text-soft); flex: none; }
  .bar { height: 16px; background: var(--primary); border-radius: 4px; }
  .val { font-size: .72rem; color: var(--text-soft); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#8FAE84"/><text x="50" y="62" font-size="34" text-anchor="middle" fill="#1A1A1A" font-family="serif">SC</text></svg></template>
  <div class="row"><span class="tok">--space-2xs</span><span class="bar" style="width:.3rem"></span><span class="val">0.3rem</span></div>
  <div class="row"><span class="tok">--space-xs</span><span class="bar" style="width:.5rem"></span><span class="val">0.5rem</span></div>
  <div class="row"><span class="tok">--space-sm</span><span class="bar" style="width:.8rem"></span><span class="val">0.8rem</span></div>
  <div class="row"><span class="tok">--space-md</span><span class="bar" style="width:1rem"></span><span class="val">1rem</span></div>
  <div class="row"><span class="tok">--space-lg</span><span class="bar" style="width:1.2rem"></span><span class="val">1.2rem</span></div>
  <div class="row"><span class="tok">--space-xl</span><span class="bar" style="width:1.6rem"></span><span class="val">1.6rem</span></div>
  <div class="row"><span class="tok">--space-2xl</span><span class="bar" style="width:2rem"></span><span class="val">2rem</span></div>
</body>
</html>
