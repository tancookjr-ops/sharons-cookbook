<!-- @dsCard group="Colors" viewport="700x170" name="Ink — Text colours" subtitle="The two text tones on cream, plus selection tint" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); padding: 20px 22px; font-family: var(--font-body); color: var(--text); }
  .row { display: flex; gap: 26px; flex-wrap: wrap; align-items: center; }
  .swatch { display: flex; gap: 12px; align-items: center; }
  .box { width: 56px; height: 56px; border-radius: 10px; border: 1px solid rgb(0 0 0 / .06); }
  .nm { font-weight: 700; font-size: .82rem; }
  .hx { font-size: .72rem; color: var(--text-soft); font-variant-numeric: tabular-nums; }
  .sample { font-size: 1rem; }
  .sample .soft { color: var(--text-soft); }
  .sel { background: var(--primary-soft); padding: 0 .2em; border-radius: 3px; }
</style>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#8FAE84"/><text x="50" y="62" font-size="34" text-anchor="middle" fill="#1A1A1A" font-family="serif">SC</text></svg></template>
  <div class="row">
    <div class="swatch"><div class="box" style="background:var(--ink)"></div><div><div class="nm">--ink · --text</div><div class="hx">#2c332d</div></div></div>
    <div class="swatch"><div class="box" style="background:var(--ink-soft)"></div><div><div class="nm">--ink-soft · --text-soft</div><div class="hx">#5d675e</div></div></div>
  </div>
  <p class="sample" style="margin-top:18px">Body text is <strong>ink</strong>; supporting copy, captions and meta use <span class="soft">soft ink</span>. Selecting text tints it <span class="sel">sage soft</span>.</p>
</body>
</html>
