<!-- @dsCard group="Brand" viewport="700x250" name="Iconography — nav glyphs" subtitle="Unicode symbols, not an icon font — one per section" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); padding: 20px 24px; color: var(--text); font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 18px; }
  .item { display: flex; align-items: center; gap: 12px; }
  .gly { width: 2rem; height: 2rem; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; color: var(--primary-deep); background: var(--primary-soft); border-radius: 8px; flex: none; }
  .lbl { font-size: .84rem; font-weight: 600; }
  .glyph-char { font-size: .72rem; color: var(--text-soft); }
  .note { font-size: .76rem; color: var(--text-soft); margin: 0 0 14px; }
</style>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#8FAE84"/><text x="50" y="62" font-size="34" text-anchor="middle" fill="#1A1A1A" font-family="serif">SC</text></svg></template>
  <p class="note">The app uses plain Unicode glyphs styled with CSS — no icon font, no SVG sprite. Each navigation section owns one symbol.</p>
  <div class="grid">
    <div class="item"><span class="gly">◐</span><span><div class="lbl">Dashboard</div><div class="glyph-char">U+25D0</div></span></div>
    <div class="item"><span class="gly">✎</span><span><div class="lbl">Recipes</div><div class="glyph-char">U+270E</div></span></div>
    <div class="item"><span class="gly">▦</span><span><div class="lbl">Meal planner</div><div class="glyph-char">U+25A6</div></span></div>
    <div class="item"><span class="gly">▤</span><span><div class="lbl">Pantry</div><div class="glyph-char">U+25A4</div></span></div>
    <div class="item"><span class="gly">☰</span><span><div class="lbl">Household</div><div class="glyph-char">U+2630</div></span></div>
    <div class="item"><span class="gly">✦</span><span><div class="lbl">Botanicals</div><div class="glyph-char">U+2726</div></span></div>
    <div class="item"><span class="gly">❀</span><span><div class="lbl">Garden</div><div class="glyph-char">U+2740</div></span></div>
    <div class="item"><span class="gly">⇪</span><span><div class="lbl">AI import</div><div class="glyph-char">U+21EA</div></span></div>
    <div class="item"><span class="gly">⚙</span><span><div class="lbl">Settings</div><div class="glyph-char">U+2699</div></span></div>
  </div>
</body>
</html>
