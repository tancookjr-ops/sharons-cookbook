<!-- @dsCard group="Colors" viewport="700x200" name="Neutrals — Linen & driftwood" subtitle="Cream backgrounds, paper surfaces, sand, driftwood, hairline" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); padding: 20px 22px; font-family: var(--font-body); color: var(--text); }
  .sw { display: flex; gap: 14px; flex-wrap: wrap; }
  .chip { width: 150px; }
  .box { height: 70px; border-radius: 10px; border: 1px solid var(--border); }
  .nm { font-weight: 700; font-size: .78rem; margin-top: 9px; }
  .hx { font-size: .72rem; color: var(--text-soft); font-variant-numeric: tabular-nums; }
  .use { font-size: .7rem; color: var(--text-soft); margin-top: 2px; }
</style>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#8FAE84"/><text x="50" y="62" font-size="34" text-anchor="middle" fill="#1A1A1A" font-family="serif">SC</text></svg></template>
  <div class="sw">
    <div class="chip"><div class="box" style="background:var(--cream)"></div><div class="nm">--cream · --bg</div><div class="hx">#faf6ef</div><div class="use">Page background</div></div>
    <div class="chip"><div class="box" style="background:var(--paper)"></div><div class="nm">--paper · --surface</div><div class="hx">#ffffff</div><div class="use">Cards, inputs, panels</div></div>
    <div class="chip"><div class="box" style="background:var(--sand)"></div><div class="nm">--sand · --surface-2</div><div class="hx">#ede5d8</div><div class="use">Chips, seg track, tray</div></div>
    <div class="chip"><div class="box" style="background:var(--driftwood)"></div><div class="nm">--driftwood</div><div class="hx">#8a7a66</div><div class="use">Input hover border</div></div>
    <div class="chip"><div class="box" style="background:var(--border)"></div><div class="nm">--border</div><div class="hx">#ddd4c4</div><div class="use">Hairlines, dividers</div></div>
  </div>
</body>
</html>
