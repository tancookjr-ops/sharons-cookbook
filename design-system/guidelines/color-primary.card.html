<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); padding: 20px 22px; font-family: var(--font-body); color: var(--text); }
  .sw { display: flex; gap: 14px; flex-wrap: wrap; }
  .chip { width: 156px; }
  .box { height: 74px; border-radius: 10px; border: 1px solid rgb(0 0 0 / .06); }
  .nm { font-weight: 700; font-size: .8rem; margin-top: 9px; }
  .hx { font-size: .72rem; color: var(--text-soft); font-variant-numeric: tabular-nums; }
  .use { font-size: .7rem; color: var(--text-soft); margin-top: 2px; }
</style>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#8FAE84"/><text x="50" y="62" font-size="34" text-anchor="middle" fill="#1A1A1A" font-family="serif">SC</text></svg></template>
  <div class="sw">
    <div class="chip"><div class="box" style="background:var(--sage)"></div><div class="nm">--sage · --primary</div><div class="hx">#6e8b63</div><div class="use">Buttons, active nav</div></div>
    <div class="chip"><div class="box" style="background:var(--sage-deep)"></div><div class="nm">--sage-deep · --primary-deep</div><div class="hx">#4c6644</div><div class="use">Links, hover, step markers</div></div>
    <div class="chip"><div class="box" style="background:var(--sage-soft)"></div><div class="nm">--sage-soft · --primary-soft</div><div class="hx">#e4ebdf</div><div class="use">Tag chips, active tint, rings</div></div>
  </div>
</body>
</html>
