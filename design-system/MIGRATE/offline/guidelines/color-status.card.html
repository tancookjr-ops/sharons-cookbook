  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<style>/* ==================================================================\n   styles.css — Sharon's Cookbook design system entry point.\n\n   Consumers link THIS one file. It is a manifest of @import lines only;\n   every rule lives in a focused file below. Order matters: fonts and\n   tokens first (they define the custom properties everything else\n   references), then base element styles, then shared primitives, then\n   feature compositions.\n\n   Palette & type: coastal Nova Scotia meets a Mediterranean kitchen.\n   Ground truth: tancookjr-ops/sharons-cookbook (see readme.md).\n   ================================================================== */\n\n/* 1 — webfonts (display fallback; see fonts.css) */\n/* ==================================================================\n   fonts.css — webfont declarations.\n\n   Sharon's Cookbook is an offline-first PWA and deliberately ships NO\n   webfonts: body copy uses the platform UI sans (system-ui) and display\n   headings use the platform's warm old-style serif — \"Iowan Old Style\"\n   on Apple, \"Palatino Linotype\" on Windows, Georgia everywhere else.\n\n   For portability of THIS design system (so specimens, cards and mockups\n   render a consistent warm serif on Linux/Android where none of those are\n   installed), we load Gelasio — a metric-compatible stand-in for Georgia,\n   which is exactly the product's own final serif fallback. On Apple and\n   Windows the native faces still win. See readme.md → VISUAL FOUNDATIONS.\n   ================================================================== */\n\n/* Gelasio: Georgia-metric-compatible book serif (display fallback only). */\n/* vietnamese */\n@font-face {\n  font-family: 'Gelasio';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"6afc42ba-5d9b-43c5-8653-7e9280ae6df3\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01 elasio';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c60a1b70-2fbe-4270-a587-5c77324b3204\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Gelasio';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"84515210-2188-450e-8661-ff46d3c0dd46\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* \"Iowan Old Style\" is an Apple system serif with no distributable file, so it\n   is declared as a LOCAL-ONLY face (no url() to download). This is not a\n   substitution — it names the exact same family the product uses. Where the\n   font is installed (Apple), it renders; where it is not, this face resolves to\n   nothing and the --font-display stack falls through to Palatino → Gelasio →\n   Georgia exactly as before. To bake in a specific serif, upload its files and\n   add a url() src here. */\n@font-face {\n  font-family: \"Iowan Old Style\";\n  src: local(\"Iowan Old Style\"), local(\"IowanOldStyle\"), local(\"Iowan Old Style Roman\");\n  font-weight: 400 700;\n  font-style: normal;\n  font-display: swap;\n}\n\n\n/* 2 — design tokens (CSS custom properties) */\n/* ==================================================================\n   colors.css — the Sharon's Cookbook palette.\n\n   \"Coastal Nova Scotia meets a Mediterranean kitchen\": herbs (sage),\n   sea glass (soft teal), driftwood (warm grey-brown), cream linen\n   backgrounds, a restrained terracotta accent.\n\n   Light tokens live on :root. [data-theme=\"dark\"] overrides them;\n   [data-theme=\"auto\"] follows the device preference. Values are copied\n   verbatim from the product's css/app.css — do not round or \"tidy\".\n   ================================================================== */\n\n:root {\n  /* --- brand hues (raw palette) --- */\n  --cream:           #faf6ef;\n  --paper:           #ffffff;\n  --sand:            #ede5d8;\n  --driftwood:       #8a7a66;\n  --sage:            #6e8b63;\n  --sage-deep:       #4c6644;\n  --sage-soft:       #e4ebdf;\n  --seaglass:        #63a294;\n  --seaglass-soft:   #ddeeea;\n  --terracotta:      #c05f36;\n  --terracotta-soft: #f6e3d9;\n  --ink:             #2c332d;\n  --ink-soft:        #5d675e;\n\n  /* --- semantic aliases (use these in product code) --- */\n  --bg:            var(--cream);\n  --surface:       var(--paper);\n  --surface-2:     var(--sand);\n  --text:          var(--ink);\n  --text-soft:     var(--ink-soft);\n  --border:        #ddd4c4;\n\n  --primary:       var(--sage);\n  --primary-deep:  var(--sage-deep);\n  --primary-soft:  var(--sage-soft);\n  --accent:        var(--seaglass);\n  --accent-soft:   var(--seaglass-soft);\n  --danger:        var(--terracotta);\n  --danger-soft:   var(--terracotta-soft);\n  --warn:          #b98a2e;\n  --warn-soft:     #f5ecd6;\n\n  /* Text colour that sits on a --primary fill (sage). White in light mode;\n     dark ink in dark mode, where the sage lightens. */\n  --on-primary:    #ffffff;\n\n  color-scheme: light;\n}\n\n/* ------------------------------ dark ------------------------------ */\n[data-theme=\"dark\"] {\n  --bg:            #1d2521;\n  --surface:       #273129;\n  --surface-2:     #303b32;\n  --text:          #e9e5d9;\n  --text-soft:     #a8b0a3;\n  --border:        #3c463d;\n  --primary:       #8fae84;\n  --primary-deep:  #a9c69e;\n  --primary-soft:  #35422f;\n  --accent:        #7fb8ab;\n  --accent-soft:   #2c423d;\n  --danger:        #d98a63;\n  --danger-soft:   #46302a;\n  --warn:          #d3ad58;\n  --warn-soft:     #423a26;\n  --on-primary:    #1d2521;\n  color-scheme: dark;\n}\n\n@media (prefers-color-scheme: dark) {\n  [data-theme=\"auto\"] {\n    --bg:            #1d2521;\n    --surface:       #273129;\n    --surface-2:     #303b32;\n    --text:          #e9e5d9;\n    --text-soft:     #a8b0a3;\n    --border:        #3c463d;\n    --primary:       #8fae84;\n    --primary-deep:  #a9c69e;\n    --primary-soft:  #35422f;\n    --accent:        #7fb8ab;\n    --accent-soft:   #2c423d;\n    --danger:        #d98a63;\n    --danger-soft:   #46302a;\n    --warn:          #d3ad58;\n    --warn-soft:     #423a26;\n    --on-primary:    #1d2521;\n    color-scheme: dark;\n  }\n}\n\n/* ==================================================================\n   typography.css — type tokens.\n\n   Two families only: a platform UI sans for everything readable, and a\n   warm old-style serif for display (headings, brand, recipe titles,\n   numbered step markers). Stacks copied verbatim from css/app.css, with\n   Gelasio added before Georgia as a cross-platform display fallback\n   (see fonts.css).\n   ================================================================== */\n\n:root {\n  /* --- families --- */\n  --font-body:    system-ui, -apple-system, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-display: \"Iowan Old Style\", \"Palatino Linotype\", Palatino, \"Gelasio\", Georgia, \"Times New Roman\", serif;\n  --font-mono:    ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n\n  /* --- master scale knob --- */\n  /* Settings → font size multiplies this (0.9–1.3 in the product). */\n  --font-scale: 1;\n\n  /* --- type ramp (em-based, as used across the app) --- */\n  --text-h1:   1.9em;    /* page titles            */\n  --text-h2:   1.35em;   /* section / card titles  */\n  --text-h3:   1.1em;    /* sub-sections           */\n  --text-body: 1rem;     /* body copy              */\n  --text-sm:   0.9em;    /* labels, meta           */\n  --text-xs:   0.78em;   /* chips, captions        */\n\n  /* --- weights --- */\n  --weight-normal:   400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n\n  /* --- line heights --- */\n  --leading-tight: 1.2;   /* headings          */\n  --leading-body:  1.55;  /* body              */\n\n  /* --- tracking --- */\n  --tracking-heading: 0.01em;\n  --tracking-caps:    0.06em;   /* uppercase eyebrow labels */\n}\n\n/* ==================================================================\n   spacing.css — spacing rhythm + layout metrics.\n\n   The product sizes most gaps in em/rem inline rather than from named\n   tokens; these variables codify the rhythm it actually uses (0.3 / 0.5 /\n   0.8 / 1 / 1.2 / 1.6 / 2 rem) so new work stays consistent with it.\n   ================================================================== */\n\n:root {\n  /* --- spacing scale --- */\n  --space-3xs: 0.15rem;\n  --space-2xs: 0.3rem;\n  --space-xs:  0.5rem;\n  --space-sm:  0.8rem;\n  --space-md:  1rem;\n  --space-lg:  1.2rem;\n  --space-xl:  1.6rem;\n  --space-2xl: 2rem;\n  --space-3xl: 3rem;\n\n  /* --- common paddings --- */\n  --pad-card:   1.1rem 1.2rem;   /* .form-card / .dash-card / .garden-card */\n  --pad-btn:    0.55em 1.1em;     /* .btn                                   */\n  --pad-input:  0.5em 0.8em;      /* .input                                 */\n\n  /* --- layout metrics --- */\n  --main-max:      74rem;    /* centred content column width  */\n  --sidebar-w:     15.5rem;  /* docked sidebar (desktop)      */\n  --topbar-h:      3.4rem;   /* sticky top bar                */\n  --breakpoint-dock: 900px;  /* sidebar docks at this width   */\n}\n\n/* ==================================================================\n   shape.css — corner radii, borders, elevation, motion.\n\n   Soft rounded corners and two low, warm-tinted shadows. Shadows are\n   tinted with the ink hue (rgb 44 51 45) rather than pure black, so\n   elevation reads soft and natural. Values verbatim from css/app.css.\n   ================================================================== */\n\n:root {\n  /* --- radii --- */\n  --radius:     12px;    /* cards, dialogs, panels        */\n  --radius-sm:  8px;     /* inputs, chips-in-slots, tiles */\n  --radius-pill: 999px;  /* buttons, chips, segmented ctl */\n\n  /* --- borders --- */\n  --border-width: 1px;\n  --border-color: var(--border);   /* hairline; see colors.css */\n\n  /* --- elevation (ink-tinted, low and soft) --- */\n  --shadow-card: 0 1px 2px rgb(44 51 45 / .06), 0 4px 16px rgb(44 51 45 / .07);\n  --shadow-pop:  0 4px 12px rgb(44 51 45 / .14), 0 12px 40px rgb(44 51 45 / .18);\n\n  /* focus ring: 3px soft primary halo used on inputs */\n  --ring: 0 0 0 3px var(--primary-soft);\n\n  /* --- motion --- */\n  --ease:        cubic-bezier(.2, .6, .2, 1);  /* @kind other */\n  --dur-fast:    .12s;   /* @kind other */\n  --dur-base:    .15s;   /* @kind other */\n  --dur-slow:    .22s;   /* @kind other */\n}\n\n/* Dark mode deepens the shadows (see colors.css keeps colour tokens;\n   these live here because they are elevation, not palette). */\n[data-theme=\"dark\"] {\n  --shadow-card: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25);\n  --shadow-pop:  0 4px 12px rgb(0 0 0 / .4), 0 12px 40px rgb(0 0 0 / .5);\n}\n@media (prefers-color-scheme: dark) {\n  [data-theme=\"auto\"] {\n    --shadow-card: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25);\n    --shadow-pop:  0 4px 12px rgb(0 0 0 / .4), 0 12px 40px rgb(0 0 0 / .5);\n  }\n}\n\n\n/* 3 — base element styles + reset */\n/* ==================================================================\n   base.css — reset + base element styles.\n\n   Sets the page background, body type, heading faces and link colours\n   from the tokens so anything that links styles.css inherits the brand\n   look without any classes. Verbatim from css/app.css.\n   ================================================================== */\n\n*, *::before, *::after { box-sizing: border-box; }\n\n/* The hidden attribute must always win, even over display:flex rules. */\n[hidden] { display: none !important; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--text);\n  font-family: var(--font-body);\n  font-size: calc(1rem * var(--font-scale));\n  line-height: var(--leading-body);\n  -webkit-font-smoothing: antialiased;\n}\n\nimg, svg { max-width: 100%; display: block; }\n\n/* --- headings: the display serif --- */\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: var(--weight-semibold);\n  line-height: var(--leading-tight);\n  margin: 0 0 .5em;\n  color: var(--text);\n  letter-spacing: var(--tracking-heading);\n}\nh1 { font-size: var(--text-h1); }\nh2 { font-size: var(--text-h2); }\nh3 { font-size: var(--text-h3); }\nh2 small, h1 small {\n  font-family: var(--font-body); font-size: .55em;\n  color: var(--text-soft); font-weight: 400;\n}\n\np { margin: 0 0 .8em; }\n\na { color: var(--primary-deep); text-underline-offset: 2px; }\na:hover { color: var(--primary); }\n\n::selection { background: var(--primary-soft); }\n\n/* Focus visibility — keyboard navigation is a first-class feature. */\n:focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 2px;\n  border-radius: 4px;\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation: none !important; transition: none !important; }\n}\n\n/* --- a few shared helpers used across the app --- */\n.sr-only {\n  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;\n  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;\n}\n.hint { color: var(--text-soft); font-size: .85em; }\n.spacer { flex: 1; }\n\n\n/* 4 — shared UI primitives (buttons, chips, inputs, cards, …) */\n/* ==================================================================\n   components.css — shared UI primitives (buttons, chips, inputs, form\n   cards, segmented controls, alerts, toasts, dialog, tables, empty\n   states). These are the design-system layer shared across every\n   feature of the app — verbatim from css/app.css, css/forms.css and the\n   shared parts of css/layout.css. Feature compositions (recipe cards,\n   planner grid, pantry tables, …) live in patterns.css.\n\n   The React components under components/ are thin wrappers over exactly\n   these classes, so the API and the markup stay in lock-step.\n   ================================================================== */\n\n/* ---------------------------- buttons ------------------------------ */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: .4em;\n  font: inherit; font-weight: 600; font-size: .95em;\n  padding: .55em 1.1em; border-radius: 999px;\n  border: 1px solid transparent; cursor: pointer;\n  text-decoration: none; white-space: nowrap;\n  transition: background .15s, color .15s, border-color .15s, transform .05s;\n  touch-action: manipulation;\n}\n.btn:active { transform: translateY(1px); }\n\n.btn-primary { background: var(--primary); color: var(--on-primary); }\n.btn-primary:hover { background: var(--primary-deep); color: var(--on-primary); }\n\n.btn-ghost {\n  background: var(--surface); color: var(--text);\n  border-color: var(--border);\n}\n.btn-ghost:hover { border-color: var(--primary); color: var(--primary-deep); }\n\n.btn-danger { background: var(--danger); color: #fff; }\n.btn-danger:hover { filter: brightness(.92); }\n.btn-danger-ghost { background: transparent; color: var(--danger); border-color: var(--danger); }\n.btn-danger-ghost:hover { background: var(--danger-soft); }\n\n.btn-sm { font-size: .82em; padding: .35em .8em; }\n.btn-lg { font-size: 1.05em; padding: .7em 1.6em; }\n.btn[disabled], .btn:disabled { opacity: .5; cursor: not-allowed; }\n\n.icon-btn {\n  display: inline-flex; align-items: center; justify-content: center;\n  width: 2.2em; height: 2.2em; border-radius: 50%;\n  border: none; background: transparent; color: var(--text-soft);\n  font: inherit; cursor: pointer; flex: none;\n}\n.icon-btn:hover { background: var(--surface-2); color: var(--text); }\n.icon-btn svg { width: 1.3em; height: 1.3em; }\n\n/* ------------------------------ chips ------------------------------ */\n.chip {\n  display: inline-block; padding: .1em .7em; border-radius: 999px;\n  font-size: .78em; font-weight: 600; background: var(--surface-2);\n  color: var(--text-soft); white-space: nowrap;\n}\n.chip-tag    { background: var(--primary-soft); color: var(--primary-deep); }\n.chip-danger { background: var(--danger-soft); color: var(--danger); }\n.chip-warn   { background: var(--warn-soft); color: var(--warn); }\n.chip-info   { background: var(--accent-soft); color: var(--accent); }\n.chip-sm     { font-size: .7em; }\n\n/* ------------------------------ inputs ----------------------------- */\n.input {\n  font: inherit; color: var(--text);\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-sm);\n  padding: .5em .8em;\n  width: 100%;\n  min-width: 0;\n  transition: border-color .15s;\n}\n.input:hover { border-color: var(--driftwood); }\n.input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }\n.input::placeholder { color: var(--text-soft); opacity: .8; }\ntextarea.input { resize: vertical; line-height: 1.5; }\n.input-sm { font-size: .85em; padding: .3em .6em; width: auto; }\nselect.input { appearance: auto; }\n\nlabel {\n  display: block; font-size: .9em; font-weight: 600; color: var(--text-soft);\n}\nlabel > .input { margin-top: .25em; font-weight: 400; font-size: 1.05em; }\n\n.check-label {\n  display: flex; align-items: center; gap: .5em;\n  font-weight: 500; color: var(--text); cursor: pointer; font-size: .95em;\n}\n.check-label input { accent-color: var(--primary); width: 1.1em; height: 1.1em; }\n.check-label.sm { font-size: .8em; }\n\n.radio-fieldset, .check-fieldset {\n  border: 1px solid var(--border); border-radius: var(--radius-sm);\n  padding: .6rem .9rem; display: flex; gap: 1rem; flex-wrap: wrap;\n}\n.radio-fieldset legend, .check-fieldset legend {\n  font-size: .85em; font-weight: 600; color: var(--text-soft); padding: 0 .4em;\n}\n\n/* ---------------------------- form cards --------------------------- */\n.form-card {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow-card);\n  padding: 1.1rem 1.2rem;\n  display: flex; flex-direction: column; gap: .8rem;\n  min-width: 0;\n}\n.form-card legend, .form-card > h2 {\n  font-family: var(--font-display); font-size: 1.15em; font-weight: 600;\n  padding: 0; margin: 0 0 .2em;\n}\nfieldset.form-card { margin: 0; }\n\n/* --------------------------- generic card -------------------------- */\n/* Neutral surface card used everywhere (dashboard, panels, tiles). */\n.card {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow-card);\n  padding: 1.1rem 1.2rem;\n  min-width: 0;\n}\n.card-flush { padding: 0; overflow: hidden; }\n.card-accent-top    { border-top: 4px solid var(--primary); }\n.card-accent-left   { border-left: 4px solid var(--primary); }\n.card-accent-warn   { border-left: 4px solid var(--danger); }\n.card-accent-info   { border-left: 4px solid var(--accent); }\n\n/* --------------------- segmented control (tabs) -------------------- */\n.seg {\n  display: inline-flex; flex-wrap: wrap; gap: .25rem;\n  background: var(--surface-2); border-radius: 999px; padding: .25rem;\n}\n.seg-btn {\n  border: none; background: transparent; color: var(--text-soft);\n  font: inherit; font-weight: 600; font-size: .9em;\n  padding: .4em 1em; border-radius: 999px; cursor: pointer;\n}\n.seg-btn:hover { color: var(--text); }\n.seg-btn.active { background: var(--surface); color: var(--primary-deep); box-shadow: var(--shadow-card); }\n.seg-btn small { font-weight: 400; opacity: .7; }\n\n/* ------------------------------ alerts ----------------------------- */\n.alert-strip { display: flex; gap: .5rem; flex-wrap: wrap; }\n.alert-pill {\n  padding: .3em 1em; border-radius: 999px; font-size: .85em; font-weight: 600;\n}\n.alert-danger { background: var(--danger-soft); color: var(--danger); }\n.alert-warn   { background: var(--warn-soft); color: var(--warn); }\n.alert-info   { background: var(--accent-soft); color: var(--accent); }\n\n/* ------------------------------ toasts ----------------------------- */\n.toast {\n  background: var(--ink); color: var(--cream);\n  padding: .7em 1.2em; border-radius: var(--radius-sm);\n  box-shadow: var(--shadow-pop);\n  text-align: center; font-size: .95em;\n  display: inline-block;\n}\n[data-theme=\"dark\"] .toast { background: var(--sand); color: var(--ink); }\n@media (prefers-color-scheme: dark) { [data-theme=\"auto\"] .toast { background: var(--sand); color: var(--ink); } }\n.toast-success { border-left: 4px solid var(--primary); }\n.toast-warn    { border-left: 4px solid var(--warn); }\n.toast-error   { border-left: 4px solid var(--danger); }\n\n/* ------------------------------ dialog ----------------------------- */\n.app-dialog {\n  border: none; border-radius: var(--radius);\n  background: var(--surface); color: var(--text);\n  box-shadow: var(--shadow-pop);\n  width: min(92vw, 30rem); padding: 0;\n}\n.app-dialog.dialog-wide { width: min(94vw, 42rem); }\n.app-dialog::backdrop { background: rgb(20 26 22 / .45); backdrop-filter: blur(2px); }\n.dialog-body { padding: 1.4rem; display: flex; flex-direction: column; gap: .8rem; }\n.dialog-title { margin: 0; }\n.dialog-message { font-size: 1.05em; }\n.dialog-actions { display: flex; gap: .6rem; justify-content: flex-end; align-items: center; margin-top: .4rem; }\n\n/* ---------------------------- empty state -------------------------- */\n.empty-state {\n  text-align: center; padding: 3rem 1rem; color: var(--text-soft);\n  background: var(--surface); border: 1px dashed var(--border);\n  border-radius: var(--radius); margin: 1rem 0;\n}\n.empty-state .btn { margin-top: .5rem; }\n\n/* ------------------------------ tables ----------------------------- */\n.stats-table { border-collapse: collapse; width: 100%; }\n.stats-table th, .stats-table td {\n  text-align: left; padding: .35em .5em; border-bottom: 1px solid var(--border);\n  font-size: .92em;\n}\n.stats-table th { color: var(--text-soft); font-weight: 500; }\n.stats-table td { text-align: right; font-variant-numeric: tabular-nums; }\n\n\n/* 5 — feature compositions (shell, recipe cards, planner, pantry, …) */\n/* ==================================================================\n   patterns.css — feature compositions built from the primitives:\n   the app shell, recipe cards + detail, dashboard cards, planner grid,\n   pantry tables, shopping lists and garden cards. Verbatim from the\n   product's per-feature stylesheets (css/layout, dashboard, recipes,\n   planner, pantry, shopping, garden). UI-kit screens use these classes.\n   ================================================================== */\n\n/* ============================ app shell =========================== */\n.app-shell {\n  min-height: 100dvh;\n  display: grid;\n  grid-template-rows: auto 1fr;\n  grid-template-areas: \"topbar\" \"main\";\n}\n\n.topbar {\n  grid-area: topbar;\n  position: sticky; top: 0; z-index: 40;\n  display: flex; align-items: center; gap: .4rem;\n  padding: .45rem max(.8rem, env(safe-area-inset-right)) .45rem max(.8rem, env(safe-area-inset-left));\n  background: color-mix(in srgb, var(--bg) 88%, transparent);\n  backdrop-filter: blur(10px);\n  border-bottom: 1px solid var(--border);\n}\n.topbar-spacer { flex: 1; }\n\n.brand { display: inline-flex; align-items: center; gap: .55rem; text-decoration: none; color: var(--text); }\n.brand-mark { width: 1.8rem; height: 1.8rem; }\n.brand-name { font-family: var(--font-display); font-size: 1.25em; font-weight: 600; letter-spacing: .01em; }\n\n.net-status { font-size: .8em; color: var(--text-soft); }\n.net-status.offline { background: var(--warn-soft); color: var(--warn); padding: .15em .7em; border-radius: 999px; font-weight: 600; }\n\n.sidebar {\n  position: fixed; z-index: 60; top: 0; bottom: 0; left: 0;\n  width: min(78vw, 17rem);\n  background: var(--surface);\n  border-right: 1px solid var(--border);\n  padding: 1rem .8rem calc(1rem + env(safe-area-inset-bottom));\n  transform: translateX(-102%);\n  transition: transform .22s ease;\n  display: flex; flex-direction: column; overflow-y: auto;\n}\n.nav-open .sidebar { transform: none; box-shadow: var(--shadow-pop); }\n.sidebar-scrim { position: fixed; inset: 0; z-index: 55; background: rgb(20 26 22 / .4); }\n\n.nav-list { list-style: none; margin: 0; padding: 0; flex: 1; }\n.nav-list a {\n  display: flex; align-items: center; gap: .7rem;\n  padding: .6rem .9rem; margin: .1rem 0;\n  border-radius: var(--radius-sm);\n  color: var(--text); text-decoration: none; font-weight: 500;\n}\n.nav-list a:hover { background: var(--surface-2); }\n.nav-list a.active { background: var(--primary-soft); color: var(--primary-deep); font-weight: 700; }\n.nav-ico { width: 1.4em; text-align: center; opacity: .75; font-style: normal; }\n.nav-sep { border-top: 1px solid var(--border); margin: .6rem .4rem; list-style: none; }\n.sidebar-foot { color: var(--text-soft); font-size: .78em; margin: .8rem .9rem 0; }\n\n.main {\n  grid-area: main;\n  padding: 1rem max(1rem, env(safe-area-inset-right)) 4rem max(1rem, env(safe-area-inset-left));\n  width: 100%; max-width: 74rem; margin: 0 auto; outline: none;\n}\n\n/* ----------------------- mobile tab bar (shell) -------------------- */\n/* Primary navigation on small screens: a fixed bottom tab bar with the\n   four main destinations + \"More\" (opens the off-canvas sidebar).\n   Hidden at >=900px where the sidebar docks. */\n.tabbar {\n  position: fixed; z-index: 50; left: 0; right: 0; bottom: 0;\n  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: .2rem;\n  padding: .25rem max(.4rem, env(safe-area-inset-right)) calc(.25rem + env(safe-area-inset-bottom)) max(.4rem, env(safe-area-inset-left));\n  background: color-mix(in srgb, var(--bg) 92%, transparent);\n  backdrop-filter: blur(10px);\n  border-top: 1px solid var(--border);\n}\n.tabbar button {\n  appearance: none; background: none; border: 0; cursor: pointer;\n  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15rem;\n  min-height: 48px; padding: .3rem .1rem;\n  border-radius: var(--radius-sm);\n  font: inherit; font-size: .66em; font-weight: 600; line-height: 1;\n  color: var(--text-soft);\n  transition: color .15s ease, background .15s ease;\n}\n.tabbar .tab-ico { font-size: 1.9em; line-height: 1.1; font-style: normal; }\n.tabbar button.active { color: var(--primary-deep); background: var(--primary-soft); }\n.tabbar button:active { transform: translateY(1px); }\n\n@media (max-width: 899.98px) {\n  .menu-btn { display: none; }              /* the tab bar's \"More\" replaces it */\n  .main { padding-bottom: calc(5.4rem + env(safe-area-inset-bottom)); }\n}\n\n@media (min-width: 900px) {\n  .tabbar { display: none; }\n  .app-shell { grid-template-columns: 15.5rem 1fr; grid-template-areas: \"topbar topbar\" \"sidebar main\"; }\n  .sidebar {\n    grid-area: sidebar; position: sticky; top: 3.4rem;\n    height: calc(100dvh - 3.4rem); transform: none; z-index: 10;\n    border-right: 1px solid var(--border); box-shadow: none;\n  }\n  .menu-btn, .sidebar-scrim { display: none; }\n  .main { padding: 1.6rem 2rem 4rem; }\n}\n\n/* Desktop sidebar collapse: the topbar menu button hides the docked\n   sidebar to give content the full width. */\n@media (min-width: 900px) {\n  .menu-btn { display: inline-flex; }\n  .app-shell.side-collapsed { grid-template-columns: 0 1fr; }\n  .app-shell.side-collapsed .sidebar { display: none; }\n  /* Nav must survive the collapse: bring the tab bar back so every\n     page keeps a persistent navigation bar at any width. */\n  .app-shell.side-collapsed .tabbar { display: grid; }\n  .app-shell.side-collapsed .main { padding-bottom: calc(5.4rem + env(safe-area-inset-bottom)); }\n}\n\n/* --------------------------- page scaffold ------------------------- */\n.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin: .4rem 0 1.2rem; }\n.page-head h1 { margin: 0; }\n.page-sub { color: var(--text-soft); margin: .2em 0 0; }\n.page-actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }\n.crumbs { margin-bottom: .8rem; font-size: .9em; }\n.result-count { color: var(--text-soft); font-size: .88em; margin: .4rem 0 .8rem; }\n\n/* ============================ dashboard =========================== */\n.dash-grid { display: grid; gap: 1rem; grid-template-columns: 1fr; }\n@media (min-width: 700px)  { .dash-grid { grid-template-columns: repeat(2, 1fr); } }\n@media (min-width: 1060px) { .dash-grid { grid-template-columns: repeat(3, 1fr); } }\n\n.dash-card {\n  background: var(--surface); border: 1px solid var(--border);\n  border-radius: var(--radius); box-shadow: var(--shadow-card);\n  padding: 1.1rem 1.2rem; display: flex; flex-direction: column; gap: .4rem; min-width: 0;\n}\n.dash-card h2 { margin: 0 0 .3em; font-size: 1.15em; }\n.dash-wide { grid-column: 1 / -1; }\n.dash-card-warn { border-left: 4px solid var(--danger); }\n.dash-empty { color: var(--text-soft); font-size: .92em; margin: 0; }\n.dash-link { margin-top: auto; font-size: .88em; font-weight: 600; text-decoration: none; }\n\n.dash-today { border-left: 4px solid var(--primary); }\n.dash-meal-list { list-style: none; margin: 0; padding: 0; }\n.dash-meal-list li { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; padding: .35em 0; border-bottom: 1px dashed var(--border); }\n.dash-meal-list li.done { opacity: .6; }\n.dash-meal-type { font-size: .72em; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); min-width: 5.4em; }\n.dash-meal-list small { color: var(--text-soft); }\n.dash-actions { display: flex; flex-wrap: wrap; gap: .5rem; }\n.dash-alert-list, .dash-harvest-list, .dash-activity, .dash-shop-summary { list-style: none; margin: 0; padding: 0; font-size: .93em; }\n.dash-alert-list li, .dash-harvest-list li, .dash-activity li, .dash-shop-summary li { padding: .3em 0; border-bottom: 1px dashed var(--border); display: flex; align-items: baseline; gap: .5em; flex-wrap: wrap; }\n.dash-activity small, .dash-harvest-list small { color: var(--text-soft); margin-left: auto; }\n.dash-shop-summary a { text-decoration: none; }\n.dash-shop-summary strong { font-size: 1.2em; }\n.dash-weather { opacity: .8; }\n\n/* ============================= recipes ============================ */\n.recipe-toolbar { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-bottom: .6rem; }\n.search-input { flex: 1 1 14rem; }\n.recipe-toolbar select { flex: 0 1 auto; width: auto; }\n/* Quick-filter chip row: horizontally scrollable on small screens. */\n.filter-chips {\n  display: flex; gap: .45rem; margin-bottom: .7rem;\n  overflow-x: auto; -webkit-overflow-scrolling: touch;\n  scrollbar-width: none; padding-bottom: .15rem;\n}\n.filter-chips::-webkit-scrollbar { display: none; }\n.filter-chip {\n  appearance: none; cursor: pointer; white-space: nowrap;\n  font: inherit; font-size: .84em; font-weight: 600;\n  padding: .38rem .8rem; min-height: 34px;\n  border-radius: 999px; border: 1px solid var(--border);\n  background: var(--surface); color: var(--text-soft);\n  transition: background .15s ease, color .15s ease, border-color .15s ease;\n}\n.filter-chip:hover { border-color: var(--primary); color: var(--primary-deep); }\n.filter-chip.active { background: var(--primary); border-color: var(--primary); color: var(--cream); }\n.filter-panel-foot { display: flex; align-items: end; }\n.filter-panel {\n  display: grid; gap: .8rem; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));\n  background: var(--surface); border: 1px solid var(--border);\n  border-radius: var(--radius); padding: 1rem; margin-bottom: 1rem; align-items: end;\n}\n\n.recipe-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr)); }\n.recipe-grid-sm { grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); }\n\n.recipe-card {\n  display: flex; flex-direction: column;\n  background: var(--surface); border: 1px solid var(--border);\n  border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-card);\n  text-decoration: none; color: var(--text);\n  transition: transform .12s ease, box-shadow .12s ease;\n}\n.recipe-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-pop); color: var(--text); }\n.recipe-card-img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: var(--surface-2); }\n.recipe-card-placeholder {\n  display: flex; align-items: center; justify-content: center;\n  font-family: var(--font-display); font-size: 2.6em; color: var(--primary);\n  background: linear-gradient(135deg, var(--primary-soft), var(--accent-soft));\n}\n.recipe-card-body { padding: .8rem .9rem 1rem; }\n.recipe-card-title { margin: 0 0 .15em; font-size: 1.08em; }\n.fav-star { color: var(--warn); }\n.recipe-card-sub { color: var(--text-soft); font-size: .85em; margin: 0 0 .3em; }\n.recipe-card-meta { color: var(--text-soft); font-size: .8em; margin: 0; display: flex; gap: .35em; flex-wrap: wrap; }\n\n.recipe-hero { display: grid; gap: 1.2rem; margin-bottom: 1rem; }\n@media (min-width: 760px) { .recipe-hero:has(.recipe-hero-img) { grid-template-columns: minmax(0, 22rem) 1fr; align-items: start; } }\n.recipe-hero-img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--radius); box-shadow: var(--shadow-card); }\n.recipe-subtitle { font-size: 1.1em; color: var(--text-soft); font-style: italic; margin-top: -.4em; }\n.recipe-meta-chips { display: flex; gap: .4rem; flex-wrap: wrap; margin: .6em 0; }\n.recipe-times { display: flex; gap: 1.4rem; flex-wrap: wrap; margin: .8em 0 0; border-top: 1px solid var(--border); padding-top: .8em; }\n.recipe-times dt { font-size: .75em; text-transform: uppercase; letter-spacing: .06em; color: var(--text-soft); }\n.recipe-times dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }\n.recipe-actions { display: flex; gap: .5rem; flex-wrap: wrap; padding: .8rem 0; margin-bottom: 1rem; border-block: 1px solid var(--border); }\n.recipe-columns { display: grid; gap: 1.6rem; margin-bottom: 1.4rem; }\n@media (min-width: 820px) { .recipe-columns { grid-template-columns: minmax(0, 20rem) 1fr; } }\n.section-head { display: flex; align-items: center; justify-content: space-between; gap: .8rem; flex-wrap: wrap; }\n.scale-control { display: inline-flex; align-items: center; gap: .3rem; background: var(--surface-2); border-radius: 999px; padding: .15rem .4rem; font-size: .88em; font-weight: 600; }\n.ing-list { list-style: none; margin: 0; padding: 0; }\n.ing-row { display: grid; grid-template-columns: 5.2em 1fr auto; gap: .6em; padding: .5em .2em; border-bottom: 1px dashed var(--border); align-items: baseline; }\n.ing-amount { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }\n.ing-optional .ing-name { color: var(--text-soft); }\n.ing-note { display: block; color: var(--text-soft); }\n.ing-pantry { color: var(--border); }\n.ing-pantry.in-pantry, .pantry-legend .in-pantry { color: var(--primary); font-weight: 700; }\n.pantry-legend { font-size: .8em; color: var(--text-soft); margin-top: .6em; }\n.step-list { margin: 0; padding-left: 1.4em; }\n.step { margin-bottom: 1.1em; padding-left: .3em; }\n.step::marker { font-family: var(--font-display); font-weight: 700; color: var(--primary); }\n.step-title { margin: 0 0 .2em; }\n.step-meta { display: flex; gap: .4rem; flex-wrap: wrap; margin: .3em 0 0; }\n.step-note { color: var(--text-soft); font-size: .9em; font-style: italic; }\n.recipe-panel { background: var(--surface); border: 1 tep.step-ok { border-left-color: var(--primary); }\n.import-step.step-conflict { border-left-color: var(--warn, #b98424); }\n.import-step.step-skip { border-left-color: var(--border); opacity: .62; }\n.import-step .chip { justify-self: start; }\n.import-step-desc { font-weight: 700; }\n.import-step-desc small { color: var(--text-soft); font-weight: 400; }\n.import-step-msg { grid-column: 2; font-size: .88em; color: var(--text-soft); }\n.photo-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin-top: .4rem; }\n.photo-slot { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .35rem; min-height: 7.5rem; border: 2px dashed var(--border); border-radius: var(--radius-sm); background: var(--surface-2); cursor: pointer; text-align: center; padding: .5rem; overflow: hidden; }\n.photo-slot:hover { border-color: var(--primary); }\n.photo-slot.filled { border-style: solid; border-color: var(--primary); }\n.photo-slot input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }\n.photo-slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }\n.photo-slot.filled .photo-slot-label { position: relative; z-index: 1; background: color-mix(in srgb, var(--bg) 85%, transparent); border-radius: 999px; padding: .1em .6em; max-width: 95%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.photo-slot-plus { font-size: 1.6em; color: var(--text-soft); }\n.photo-slot-label { font-size: .78em; font-weight: 600; color: var(--text-soft); }\n.yt-card { display: flex; align-items: center; gap: .7rem; background: var(--surface-2); border-radius: var(--radius-sm); padding: .6rem .7rem; margin-bottom: .7rem; }\n.yt-thumb { width: 4.6rem; height: 2.8rem; border-radius: var(--radius-sm); background: var(--ink, #1d241f); color: var(--cream); display: flex; align-items: center; justify-content: center; font-size: .9em; flex: none; }\n.yt-card strong { display: block; line-height: 1.3; }\n.yt-card small { color: var(--text-soft); }\n@media (max-width: 640px) { .photo-slots { grid-template-columns: 1fr; } .import-source-row { flex-direction: column; } }\n\n/* mobile agenda (week/fortnight on phones) */\n.agenda { display: flex; flex-direction: column; gap: .8rem; }\n.agenda-day { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .6rem .75rem .7rem; box-shadow: var(--shadow-card); }\n.agenda-day.is-today { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary), var(--shadow-card); }\n.agenda-head { margin: 0 0 .2rem; font-size: 1.02em; display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; }\n.agenda-head small { color: var(--text-soft); font-weight: 400; font-size: .72em; }\n.agenda-meal { display: grid; grid-template-columns: 5.2em minmax(0, 1fr); gap: .5rem; align-items: start; padding: .3rem 0; border-top: 1px dashed var(--border); }\n.agenda-meal-label { font-size: .7em; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-soft); padding-top: .7em; }\n.agenda .plan-slot { min-height: 2.4rem; padding: 0; }\n.agenda-empty-add { margin-top: .3rem; }\n\n/* delete button on recipe tiles */\n.recipe-card { position: relative; }\n.card-del { appearance: none; position: absolute; top: .35rem; right: .35rem; z-index: 1; width: 1.9rem; height: 1.9rem; border-radius: 999px; border: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 82%, transparent); color: var(--text-soft); font: inherit; font-size: 1.15em; line-height: 1; cursor: pointer; display: grid; place-items: center; }\n.card-del:hover { color: var(--danger); border-color: var(--danger); background: var(--surface); }\n\n/* month calendar */\n.month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: .3rem; }\n.month-head { text-align: center; font-size: .75em; font-weight: 600; color: var(--text-soft); padding: .25em 0; }\n.month-day {\n  position: relative; font: inherit; text-align: left; cursor: pointer;\n  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);\n  min-height: 5.8rem; padding: .35rem .4rem; overflow: hidden;\n  display: flex; flex-direction: column; gap: .18rem; align-items: stretch;\n}\n.month-day:hover { border-color: var(--primary); }\n.month-day.is-today { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); background: var(--primary-soft); }\n.month-day.drop-target { background: var(--primary-soft); outline: 2px dashed var(--primary); outline-offset: -2px; }\n.month-num { font-weight: 700; font-size: .78em; color: var(--text-soft); }\n.month-day.is-today .month-num { color: var(--primary-deep); }\n.month-dot {\n  display: block; font-size: .68em; line-height: 1.3; font-weight: 600;\n  background: var(--primary-soft); border-left: 2px solid var(--primary); border-radius: 3px;\n  padding: .12em .35em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n}\n.month-dot b { color: var(--primary-deep); font-weight: 800; }\n.month-more { font-size: .66em; color: var(--text-soft); }\n.month-count { display: none; }\n@media (max-width: 700px) {\n  .month-day { min-height: 3.4rem; }\n  .month-dot, .month-more { display: none; }\n  .month-count {\n    display: flex; align-items: center; justify-content: center;\n    width: 1.5em; height: 1.5em; border-radius: 999px; margin-top: auto;\n    background: var(--primary); color: var(--cream); font-size: .72em; font-weight: 700;\n  }\n}\n\n/* ================= phone-first frame consistency ==================\n   The app is used on phones and tablets: no page may widen the layout\n   viewport (that pushed the tab bar off-screen and forced zooming).\n   Wide content scrolls inside its own container instead. */\nhtml, body { max-width: 100%; overflow-x: clip; }\n.app-shell { max-width: 100vw; }\n.main { min-width: 0; max-width: 100%; overflow-x: clip; }\n.main img, .main svg, .main video { max-width: 100%; }\n.main table { max-width: 100%; }\n.main .input, .main select, .main textarea { max-width: 100%; min-width: 0; }\n.pantry-group { overflow-x: auto; -webkit-overflow-scrolling: touch; }\n\n/* ============================== pantry ============================ */\n.pantry-toolbar { display: flex; gap: .8rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }\n.pantry-toolbar .input { flex: 1 1 12rem; max-width: 20rem; }\n.pantry-group { margin-bottom: 1.4rem; }\n.pantry-group-title { font-size: .85em; font-family: var(--font-body); font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text-soft); margin-bottom: .3em; }\n.pantry-table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-card); }\n.pantry-table th, .pantry-table td { padding: .55em .8em; text-align: left; font-size: .93em; border-bottom: 1px solid var(--border); }\n.pantry-table thead th { font-size: .75em; text-transform: uppercase; letter-spacing: .06em; color: var(--text-soft); background: var(--surface-2); }\n.pantry-table tbody tr:last-child td { border-bottom: none; }\n.pantry-table tbody tr:hover { background: color-mix(in srgb, var(--primary-soft) 40%, transparent); }\n.pantry-qty { white-space: nowrap; font-variant-numeric: tabular-nums; }\n.pantry-qty span { display: inline-block; min-width: 4em; text-align: center; font-weight: 600; }\n\n/* ============================= shopping =========================== */\n.shop-group { margin-bottom: 1.2rem; }\n.shop-group-title { font-size: .85em; font-family: var(--font-body); font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text-soft); margin-bottom: .3em; }\n.shop-group-title small { font-weight: 400; }\n.shop-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-card); }\n.shop-item { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; padding: .45em .8em; border-bottom: 1px solid var(--border); }\n.shop-item:last-child { border-bottom: none; }\n.shop-item.priority-high { border-left: 4px solid var(--warn); }\n.shop-check { display: flex; align-items: center; gap: .6rem; flex: 1; font-weight: 500; cursor: pointer; min-width: 10rem; }\n.shop-check input { accent-color: var(--primary); width: 1.25em; height: 1.25em; flex: none; }\n.shop-item.checked .shop-name { text-decoration: line-through; color: var(--text-soft); }\n.shop-item-qty { font-variant-numeric: tabular-nums; color: var(--text-soft); font-size: .9em; white-space: nowrap; }\n.shop-item-note { color: var(--text-soft); font-size: .82em; font-style: italic; }\n\n/* ============================== garden =========================== */\n.garden-grid { display: grid; gap: 1rem; margin-top: 1rem; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); }\n.garden-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-card); padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .5rem; border-top: 4px solid var(--primary); }\n.garden-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: .5rem; }\n.garden-card-head h2 { margin: 0; font-size: 1.15em; }\n.garden-card-head small { font-family: var(--font-body); color: var(--text-soft); font-weight: 400; font-size: .7em; }\n.garden-facts { display: grid; grid-template-columns: 1fr 1fr; gap: .3rem .8rem; margin: 0; }\n.garden-facts dt { font-size: .72em; text-transform: uppercase; letter-spacing: .06em; color: var(--text-soft); }\n.garden-facts dd { margin: 0; font-weight: 600; font-size: .92em; }\n.garden-chips { display: flex; gap: .3rem; flex-wrap: wrap; margin: 0; }\n.garden-notes { color: var(--text-soft); font-size: .9em; margin: 0; }\n.cal-table { border-collapse: collapse; width: 100%; min-width: 34rem; margin-top: 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }\n.cal-table th, .cal-table td { border: 1px solid var(--border); padding: .35em .45em; text-align: center; font-size: .85em; }\n.cal-table thead th { background: var(--surface-2); font-size: .75em; }\n.cal-table tbody th { text-align: left; font-weight: 600; white-space: nowrap; }\n.cal-table td.cal-window { background: var(--primary-soft); }\n.cal-table td.cal-harvest { background: var(--accent-soft); color: var(--accent); font-weight: 700; }\n\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: var(--bg); padding: 20px 22px; font-family: var(--font-body); color: var(--text); }\n  .sw { display: flex; gap: 14px; flex-wrap: wrap; }\n  .chip { width: 156px; }\n  .box { height: 74px; border-radius: 10px; border: 1px solid rgb(0 0 0 / .06); }\n  .nm { font-weight: 700; font-size: .8rem; margin-top: 9px; }\n  .hx { font-size: .72rem; color: var(--text-soft); font-variant-numeric: tabular-nums; }\n  .use { font-size: .7rem; color: var(--text-soft); margin-top: 2px; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n  <div class=\"sw\">\n    <div class=\"chip\"><div class=\"box\" style=\"background:var(--terracotta)\"><\u002Fdiv><div class=\"nm\">--terracotta · --danger<\u002Fdiv><div class=\"hx\">#c05f36<\u002Fdiv><div class=\"use\">Delete, expired, errors<\u002Fdiv><\u002Fdiv>\n    <div class=\"chip\"><div class=\"box\" style=\"background:var(--terracotta-soft)\"><\u002Fdiv><div class=\"nm\">--terracotta-soft · --danger-soft<\u002Fdiv><div class=\"hx\">#f6e3d9<\u002Fdiv><div class=\"use\">Danger-ghost hover, chips<\u002Fdiv><\u002Fdiv>\n    <div class=\"chip\"><div class=\"box\" style=\"background:var(--warn)\"><\u002Fdiv><div class=\"nm\">--warn<\u002Fdiv><div class=\"hx\">#b98a2e<\u002Fdiv><div class=\"use\">Low stock, \"soon\", priority<\u002Fdiv><\u002Fdiv>\n    <div class=\"chip\"><div class=\"box\" style=\"background:var(--warn-soft)\"><\u002Fdiv><div class=\"nm\">--warn-soft<\u002Fdiv><div class=\"hx\">#f5ecd6<\u002Fdiv><div class=\"use\">Warn chips, offline badge<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
